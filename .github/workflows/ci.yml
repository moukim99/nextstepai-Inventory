name: CI

on:
  push:
    branches: [ "main", "master", "fix/*", "feature/*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./nextstepai-Inventory/gradlew

      - name: Run Unit Tests & Verify Android Compilation
        working-directory: ./nextstepai-Inventory
        run: ./gradlew :shared:jvmTest :androidApp:compileDebugSources --no-daemon --stacktrace

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-test-report
          path: nextstepai-Inventory/shared/build/reports/tests/jvmTest/
